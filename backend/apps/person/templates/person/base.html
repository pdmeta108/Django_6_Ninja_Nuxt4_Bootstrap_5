{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Django 6 CRUD application for managing people records.">
    <meta name="author" content="Ing. Argenis Osorio">
    <title>Person CRUD</title>
    <!-- Load Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}" />
    <!-- Load Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <a href="{% url 'person:home' %}" class="btn btn-secondary">Person CRUD</a>
        <br>
        <br>
        {% block content %}{% endblock %}
    </div>

    <!-- Load Bootstrap JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script>
        const estateSelect = document.getElementById('id_estate');
        const municipalitySelect = document.getElementById('id_municipality');

        estateSelect.addEventListener('change', (e) => {
            const estateId = e.target.value;

            fetch(`/ajax/load-municipalities/?estate_id=${estateId}`)
                .then(response => response.json())
                .then(data => {
                    municipalitySelect.innerHTML = '<option value="">---------</option>';
                    data.forEach(item => {
                        const option = new Option(item.name, item.id);
                        municipalitySelect.add(option);
                    });
                });
        });
    </script>
</body>
</html>
